<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Dashboard de Ventas Interactivo</title>

    <!-- Apple Touch Icon para iOS (guardar en pantalla de inicio) -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png" />

    <!-- Favicon: LogoReducido (normal) para tema claro, LogoReducidoclaro para tema oscuro -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/LogoReducido.svg"
      media="(prefers-color-scheme: light)" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/LogoReducidoclaro.svg"
      media="(prefers-color-scheme: dark)" />
    <!-- Fallback para navegadores que no soportan media query en favicon -->
    <link
      rel="shortcut icon"
      type="image/svg+xml"
      href="/LogoReducido.svg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
